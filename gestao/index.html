@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #101115; --surface: #16171b; --surface-2: #222328;
    --ink: #f2f1ed; --ink-2: #c9c8c3; --muted: #8e8f94; --line: #2b2c30; --axis: #3a3b40;
    --accent: #f2f1ed; --on-accent: #16171b;
    --series-1: #d9d7d0; --series-2: #a08c6e; --good-text: #8fbf91; --critical-text: #e08279;
    --shadow: 0 18px 40px rgba(0,0,0,.5);
    --rec: #6f9e72; --desp: #d0665c; --warn-bar: #c9a04a;
    --side-bg: #0b0c0f; --side-line: #222328;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #101115; --surface: #16171b; --surface-2: #222328;
  --ink: #f2f1ed; --ink-2: #c9c8c3; --muted: #8e8f94; --line: #2b2c30; --axis: #3a3b40;
  --accent: #f2f1ed; --on-accent: #16171b;
  --series-1: #d9d7d0; --series-2: #a08c6e; --good-text: #8fbf91; --critical-text: #e08279;
  --shadow: 0 18px 40px rgba(0,0,0,.5);
  --rec: #6f9e72; --desp: #d0665c; --warn-bar: #c9a04a;
  --side-bg: #0b0c0f; --side-line: #222328;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
a { color: var(--ink); text-decoration: underline; text-decoration-color: var(--axis); text-underline-offset: 3px; }
a:hover { text-decoration-color: var(--ink); }
h1 { font: 400 38px/1.1 var(--serif); letter-spacing: -.01em; margin: 0; }
h2 { font: 500 21px/1.2 var(--serif); margin: 0 0 12px; }
.muted { color: var(--muted); } .ink2 { color: var(--ink-2); } .small { font-size: 12px; }

/* layout */
.app { display: flex; min-height: 100vh; }
.side { width: 240px; flex-shrink: 0; background: var(--side-bg); color: var(--side-ink); padding: 28px 18px; display: flex; flex-direction: column; gap: 22px; position: sticky; top: 0; height: 100vh; }
.brand { display: flex; align-items: center; gap: 12px; padding: 0 8px 18px; border-bottom: 1px solid var(--side-line); color: var(--side-ink); }
.brand .simb { width: 38px; height: 38px; flex-shrink: 0; }
.brand .wm { width: 80px; }
.wm { display: block; aspect-ratio: 640 / 414; background: currentColor; -webkit-mask: var(--wm) center / contain no-repeat; mask: var(--wm) center / contain no-repeat; }
.brand small { display: block; font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--side-muted); margin-top: 4px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 10px 10px; color: var(--side-muted); font-size: 12px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; text-decoration: none; border-left: 1px solid transparent; }
.nav a:hover { color: var(--side-ink); }
.nav a.on { color: var(--side-ink); border-left-color: var(--side-ink); background: rgba(255,255,255,.04); }
.nav .mi { width: 15px; height: 15px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.nav .lock { margin-left: auto; font-size: 11px; filter: grayscale(1); }
.side .me .muted { color: var(--side-muted); }
.side .me a { color: var(--side-muted); }
.side .btn { background: transparent; color: var(--side-ink); border-color: var(--side-line); }
.side .btn:hover { background: rgba(255,255,255,.06); }
.me { margin-top: auto; padding: 0 8px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
main { flex: 1; min-width: 0; padding: 40px clamp(20px, 3vw, 56px) 64px; }
.head { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: space-between; margin-bottom: 20px; }
.head p { margin: 8px 0 0; color: var(--muted); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; }
.head p::before { content: ""; display: inline-block; width: 24px; height: 1px; background: var(--axis); vertical-align: middle; margin-right: 10px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.grid { display: grid; gap: 18px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g5 { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.tile-sel { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px; }
.tile-medio .val { font-size: 32px; white-space: nowrap; }
.tile-sel select { border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); font: inherit; font-size: 12px; padding: 2px 4px; max-width: 120px; }
.span2 { grid-column: span 2; } .span3 { grid-column: span 3; }
.mb { margin-bottom: 18px; }
@media (max-width: 900px) {
  .app { flex-direction: column; }
  .side { width: auto; height: auto; position: static; flex-direction: row; flex-wrap: wrap; align-items: center; padding: 10px 12px; gap: 10px; border-right: 0; border-bottom: 1px solid var(--line); }
  .brand { border: 0; padding: 0 4px; }
  .brand .simb { width: 30px; height: 30px; } .brand .wm { width: 64px; }
  .brand small { display: none; }
  .nav { flex-direction: row; overflow-x: auto; order: 3; width: 100%; }
  .nav a { border-left: 0; border-bottom: 1px solid transparent; } .nav a.on { border-bottom-color: var(--side-ink); }
  .nav a { white-space: nowrap; }
  .me { margin: 0 0 0 auto; flex-direction: row; align-items: center; padding: 0; }
  main { padding: 18px 16px 50px; }
  .card { padding: 16px; } .tile .val { font-size: 32px; } h1 { font-size: 32px; }
  .g2, .g3 { grid-template-columns: minmax(0, 1fr); }

/* components */

}
/* animação da logomarca */
.anim .simb path { stroke-dasharray: 1; stroke-dashoffset: 1; animation: tracar 1.5s cubic-bezier(.65,0,.35,1) forwards; }
.anim .simb path:nth-child(2) { animation-delay: .25s; }
.anim .simb path:nth-child(3) { animation-delay: .5s; }
.anim .simb path:nth-child(4) { animation-delay: .75s; }
.anim .simb { animation: girar 2.6s cubic-bezier(.2,.7,.2,1) both; }
.anim .wm { opacity: 0; animation: surgir 1.2s ease-out 1.6s forwards; }
.anim .lema { opacity: 0; animation: surgir 1.2s ease-out 2.2s forwards; }
.entrada .login { animation: surgir .9s ease-out .3s backwards; }
@keyframes tracar { to { stroke-dashoffset: 0; } }
@keyframes girar { from { transform: rotate(-8deg) scale(.94); opacity: .2; } to { transform: none; opacity: 1; } }
@keyframes surgir { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .anim .simb, .anim .simb path, .anim .wm, .anim .lema, .entrada .login { animation: none; opacity: 1; stroke-dashoffset: 0; }
}

    if (!pode("financeiro") && COLECOES_FIN.includes(k)) continue;
    for (const item of db[k]) atual.set(chaveReg(k, item.id), JSON.stringify(item));
  }
  const gravar = [], apagar = [];
  for (const [ch, txt] of atual) if (espelho.get(ch) !== txt) { const [k] = ch.split("/"); gravar.push({ colecao: k, id: String(JSON.parse(txt).id), dados: JSON.parse(txt) }); }
  for (const ch of espelho.keys()) if (!atual.has(ch)) apagar.push(ch);
  if (!gravar.length && !apagar.length) return;
  espelho = atual;
  fila = fila.then(async () => {
    if (gravar.length) for (let i = 0; i < gravar.length; i += 500) { const { error } = await sb.from("registros").upsert(gravar.slice(i, i + 500)); if (error) throw error; }
    const porCol = {};
    apagar.forEach((ch) => { const i = ch.indexOf("/"); (porCol[ch.slice(0, i)] ||= []).push(ch.slice(i + 1)); });
    for (const [k, ids] of Object.entries(porCol)) { const { error } = await sb.from("registros").delete().eq("colecao", k).in("id", ids); if (error) throw error; }
  }).catch((e) => {
    // Marca o que falhou como pendente, para ir de novo no próximo salvamento
    gravar.forEach((r) => espelho.delete(chaveReg(r.colecao, r.id)));
    apagar.forEach((ch) => espelho.set(ch, "?"));
    console.error(e); toast("Não foi possível salvar. Verifique a internet e tente de novo.");
  });
}
async function carregarDados() {
  const novo = vazio(), esp = new Map();
  for (let de = 0; ; de += 1000) {
    const { data, error } = await sb.from("registros").select("colecao,id,dados").order("colecao").order("id").range(de, de + 999);
    if (error) throw error;
    for (const r of data) if (novo[r.colecao]) { novo[r.colecao].push(r.dados); esp.set(chaveReg(r.colecao, r.id), JSON.stringify(r.dados)); }
    if (data.length < 1000) break;
  }
  db = novo; espelho = esp;
}
// Alterações feitas por outras pessoas chegam em tempo real
let canal = null, renderPendente = false;
function ouvirMudancas() {
  if (canal) sb.removeChannel(canal);
  canal = sb.channel("registros").on("postgres_changes", { event: "*", schema: "public", table: "registros" }, ({ eventType, new: n, old: o }) => {
    const r = eventType === "DELETE" ? o : n;
    if (!r || !db[r.colecao]) return;
    const ch = chaveReg(r.colecao, r.id), lista = db[r.colecao], pos = lista.findIndex((x) => String(x.id) === r.id);
    if (eventType === "DELETE") { if (!espelho.has(ch)) return; espelho.delete(ch); if (pos >= 0) lista.splice(pos, 1); }
    else { const txt = JSON.stringify(n.dados); if (espelho.get(ch) === txt) return; espelho.set(ch, txt); if (pos >= 0) lista[pos] = n.dados; else lista.push(n.dados); }
    atualizarTela();
  }).subscribe();
}

// inteiro: contagens (projetos, itens) usam só números inteiros no eixo
function escala(max, inteiro = false) {
  if (max <= 0) return { max: 1, passos: [0, 1] };
  const bruto = max / 4, mag = Math.max(inteiro ? 1 : 0, 10 ** Math.floor(Math.log10(bruto)));
  const passo = (inteiro ? [1, 2, 5, 10] : [1, 2, 2.5, 5, 10]).map((f) => f * mag).find((s) => s >= bruto);
  const topo = Math.ceil(max / passo) * passo;
  const passos = []; for (let v = 0; v <= topo + 1e-9; v += passo) passos.push(v);
  return { max: topo, passos };
}
function barrasH(dados, { moeda = false, cor = "var(--series-1)" } = {}) {
  if (!dados.length || dados.every((d) => !d.valor)) return `<p class="empty">Sem dados no período.</p>`;
  const W = Math.max(300, Math.min(520, innerWidth - 70)), rot = W < 400 ? 110 : 150, dir = 64, linha = 34, H = dados.length * linha + 22;
  const { max, passos } = escala(Math.max(...dados.map((d) => d.valor)), !moeda);
  const x = (v) => rot + (v / max) * (W - rot - dir);
  const fmt = (v) => (moeda ? R$c(v) : String(v));
  let s = `<g class="grid">${passos.map((v) => `<line x1="${x(v)}" x2="${x(v)}" y1="0" y2="${H - 22}"/><text x="${x(v)}" y="${H - 6}" text-anchor="middle">${fmt(v)}</text>`).join("")}</g>`;
  s += `<line class="axis" x1="${rot}" x2="${rot}" y1="0" y2="${H - 22}"/>`;
  dados.forEach((d, i) => {
    const y = i * linha + 7, w = Math.max(0, x(d.valor) - rot), c = d.cor || cor;
    const t = `<b>${esc(d.nome)}</b>${moeda ? R$(d.valor) : d.valor + (d.valor === 1 ? " item" : " itens")}`;
    s += `${d.href ? `<a href="${d.href}">` : ""}<g class="mark" data-tip="${esc(t)}"><rect class="hit" x="0" y="${y - 5}" width="${W}" height="${linha}"/>
      <text class="lab" x="${rot - 8}" y="${y + 14}" text-anchor="end">${esc(d.nome.length > (rot < 150 ? 15 : 22) ? d.nome.slice(0, rot < 150 ? 14 : 21) + "…" : d.nome)}</text>
      <path class="m" fill="${c}" d="M${rot},${y} h${Math.max(w - 4, 0)} a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-${Math.max(w - 4, 0)} z"/>
      <text class="lab" x="${rot + w + 6}" y="${y + 14}">${fmt(d.valor)}</text></g>${d.href ? "</a>" : ""}`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img">${s}</svg></div>`;
}
function barrasMes(dados, series, { empilhado = false, moeda = false } = {}) {
  const W = Math.max(340, Math.min(1000, innerWidth - (innerWidth > 900 ? 330 : 70))), H = 260, esq = moeda ? 64 : 34, base = H - 24, topo = 10;
  const totais = dados.map((d) => (empilhado ? series.reduce((t, s) => t + d[s.k], 0) : Math.max(...series.map((s) => d[s.k]))));
  const { max, passos } = escala(Math.max(...totais, 0), !moeda);
  const y = (v) => base - (v / max) * (base - topo);
  const fmt = (v) => (moeda ? R$c(v) : String(v));
  const col = (W - esq) / dados.length;
  let s = `<g class="grid">${passos.map((v) => `<line x1="${esq}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text x="${esq - 6}" y="${y(v) + 4}" text-anchor="end">${fmt(v)}</text>`).join("")}</g>`;
  s += `<line class="axis" x1="${esq}" x2="${W}" y1="${base}" y2="${base}"/>`;
  dados.forEach((d, i) => {
    const cx = esq + col * i + col / 2;
    const t = `<b>${esc(d.mes)}</b>` + series.map((se) => `${esc(se.label)}: ${moeda ? R$(d[se.k]) : d[se.k]}`).join("<br>");
    s += `${d.href ? `<a href="${d.href}">` : ""}<g class="mark" data-tip="${esc(t)}"><rect class="hit" x="${esq + col * i}" y="0" width="${col}" height="${base}"/>`;
    if (empilhado) {
      const bw = Math.min(30, col * 0.6); let acc = 0;
      const vis = series.filter((se) => d[se.k] > 0);
      vis.forEach((se, j) => {
        const v = d[se.k], y1 = y(acc + v), h = y(acc) - y1; acc += v;
        const ultimo = j === vis.length - 1, r = ultimo ? Math.min(4, h) : 0;
        s += `<path class="m" fill="${se.cor}" stroke="var(--surface)" stroke-width="2" d="M${cx - bw / 2},${y1 + h} v-${h - r} ${r ? `a${r},${r} 0 0 1 ${r},-${r} h${bw - 2 * r} a${r},${r} 0 0 1 ${r},${r}` : `h${bw}`} v${h - r} z"/>`;
      });
    } else {
      const bw = Math.min(16, (col * 0.7) / series.length);
      series.forEach((se, j) => {
        const v = d[se.k]; if (!v) return;
        const x0 = cx - (bw * series.length + 2 * (series.length - 1)) / 2 + j * (bw + 2);
        const y1 = y(v), h = base - y1, r = Math.min(4, h);
        s += `<path class="m" fill="${se.cor}" d="M${x0},${base} v-${h - r} a${r},${r} 0 0 1 ${r},-${r} h${bw - 2 * r} a${r},${r} 0 0 1 ${r},${r} v${h - r} z"/>`;
      });
    }
    s += `<text x="${cx}" y="${H - 6}" text-anchor="middle">${esc(d.mes)}</text></g>${d.href ? "</a>" : ""}`;
  });
  const leg = `<div class="legend">${series.map((se) => `<span style="--c:${se.cor}">${esc(se.label)}</span>`).join("")}</div>`;
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img">${s}</svg>${leg}</div>`;
}

function tileMedio(fechados) {
  const tipo = Number(filtroTipoMedio) || null;
  const ps = fechados.filter((p) => Number(p.valor) > 0 && (!tipo || p.tipos.includes(tipo)));
  const media = ps.length ? soma(ps) / ps.length : 0;
  return `<div class="card tile tile-medio"><div class="tile-sel"><a class="lbl" href="#/lista/medio" style="color:inherit">Valor médio</a><select data-act="tipo-medio" aria-label="Tipo de projeto"><option value="">Todos os tipos</option>${db.tipos.map((t) => `<option value="${t.id}" ${t.id === tipo ? "selected" : ""}>${esc(t.nome)}</option>`).join("")}</select></div>
    <a href="#/lista/medio" class="val" style="display:block;color:inherit;text-decoration:none" title="${R$(media)}">${ps.length ? R$(Math.round(media)).replace(/,00$/, "") : "—"}</a><div class="det">${ps.length ? `média de ${ps.length} projeto(s) fechado(s)` : "nenhum projeto fechado com valor"}</div></div>`;
}

/* ---------- Clientes ---------- */
let buscaCliente = "";
function pgClientes() {
  const q = buscaCliente.toLowerCase();
  const lista = db.clientes.filter((c) => !q || [c.nome, c.telefone, c.email, c.cidade].join(" ").toLowerCase().includes(q)).sort((a, b) => a.nome.localeCompare(b.nome));
  return cabecalho("Clientes", `${lista.length} cliente(s)`, botoesExportar("clientes") + `<button class="btn pri" data-act="novo-cliente">Novo cliente</button>`) +
    `<div class="mb" style="max-width:420px"><input class="input" id="busca" placeholder="Buscar por nome, telefone, e-mail ou cidade" value="${esc(buscaCliente)}"></div>
    <div class="card flush">${lista.length ? `<table><thead><tr><th>Nome</th><th>Telefone</th><th>Cidade</th><th>Origem</th><th class="num">Fechados</th><th class="num">Em aberto</th></tr></thead><tbody>${lista.map((c) => {
      const ps = db.prospeccoes.filter((p) => p.clienteId === c.id);
      return `<tr><td><a href="#/cliente/${c.id}"><b>${esc(c.nome)}</b></a></td><td>${esc(c.telefone) || "—"}</td><td>${esc(c.cidade) || "—"}</td><td>${esc(c.origem) || "—"}</td><td class="num">${ps.filter((p) => p.status === "fechado").length}</td><td class="num">${ps.filter((p) => p.status === "aberto").length}</td></tr>`;
    }).join("")}</tbody></table>` : `<p class="empty">Nenhum cliente encontrado.</p>`}</div>`;
}
function blocoContatos(clienteId, prospeccaoId) {
  const lista = db.contatos.filter((k) => k.clienteId === clienteId && (!prospeccaoId || k.prospeccaoId === prospeccaoId)).sort((a, b) => b.data.localeCompare(a.data));
  const projetos = db.prospeccoes.filter((p) => p.clienteId === clienteId);
  return `<div class="card"><h2>Histórico de contatos</h2>
    <form class="form addform mb" data-form="contato" data-cliente="${clienteId}" data-prosp="${prospeccaoId || ""}">
      <input class="input" type="date" name="data" value="${HOJE}" aria-label="Data">
      <select class="input" name="tipo" style="width:100%" aria-label="Tipo de contato">${TIPOS_CONTATO.map((t) => `<option>${t}</option>`).join("")}</select>
      ${prospeccaoId ? "" : `<select class="input full" name="prospeccaoId" style="width:100%" aria-label="Projeto"><option value="">Projeto (opcional)</option>${projetos.map((p) => `<option value="${p.id}">${esc(p.titulo)}</option>`).join("")}</select>`}
      <textarea class="input full" name="resumo" rows="2" placeholder="O que foi conversado / combinado" required></textarea>
      <div class="full"><button class="btn">Registrar contato</button></div>
    </form>
    ${lista.length ? `<ol class="timeline">${lista.map((k) => `<li><div class="dt">${dataBR(k.data)}</div><div class="bd"><b>${esc(k.tipo)}</b>${!prospeccaoId && k.prospeccaoId ? ` <span class="muted">· ${esc(prosp(k.prospeccaoId)?.titulo)}</span>` : ""}<div class="ink2">${esc(k.resumo)}</div></div><button class="btn sm danger" data-act="del-contato" data-id="${k.id}" aria-label="Excluir">×</button></li>`).join("")}</ol>` : `<p class="muted">Nenhum contato registrado ainda.</p>`}
  </div>`;
}
function tabelaLancamentos(lista) {
  return lista.length ? `<table><thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Situação</th><th class="num">Valor</th></tr></thead><tbody>${lista.map((l) => `<tr><td>${dataBR(l.data)}</td><td><a href="#" data-act="editar-lanc" data-id="${l.id}">${esc(l.descricao) || "(sem descrição)"}</a></td><td class="ink2">${esc(catNome(l))}</td><td>${situacaoLanc(l)}</td><td class="num ${l.tipo === "saida" ? "neg" : "pos"}">${l.tipo === "saida" ? "− " : "+ "}${R$(l.valor)}</td></tr>`).join("")}</tbody></table>` : `<p class="empty">Nenhum lançamento vinculado.</p>`;
}
function blocoFinanceiroVinculado(filtro, rotulo, novoParams) {
  if (!pode("financeiro")) return "";
  if (!finLiberado()) return `<div class="card mb" style="margin-top:14px">O financeiro deste ${rotulo} está bloqueado. <a href="#/financeiro">Desbloquear com a senha</a></div>`;
  const ls = db.lancamentos.filter(filtro).sort((a, b) => a.data.localeCompare(b.data));
  const ent = ls.filter((l) => l.tipo === "entrada");
  return `<h2 style="margin-top:22px">Financeiro deste ${rotulo}</h2>
    <div class="grid g3 mb">${tile("Recebido", R$(soma(ent.filter((l) => l.pago))), "", "pos")}${tile("A receber", R$(soma(ent.filter((l) => !l.pago))), ent.filter((l) => !l.pago && l.data < HOJE).length ? `<span class="neg">${ent.filter((l) => !l.pago && l.data < HOJE).length} parcela(s) atrasada(s)</span>` : "")}
    <div class="card" style="display:flex;align-items:center"><button class="btn" data-act="novo-lanc" ${novoParams}>Lançar recebimento</button></div></div>
    <div class="card flush">${tabelaLancamentos(ls)}</div>`;
}
const enderecoCompleto = (c) => [[c.endereco, c.numero].filter(Boolean).join(", "), c.bairro, [c.cidade, c.estado].filter(Boolean).join(" / "), c.cep && "CEP " + c.cep].filter(Boolean).join(" · ");
function pgCliente(id) {
  const c = cliente(id); if (!c) return `<p class="empty">Cliente não encontrado.</p>`;
  const ps = db.prospeccoes.filter((p) => p.clienteId === id).sort((a, b) => b.contato.localeCompare(a.contato));
  const info = [["Telefone / WhatsApp", c.telefone], ["E-mail", c.email], ["CPF / CNPJ", c.documento], ["Endereço", enderecoCompleto(c)], ["Origem", c.origem]];
  return cabecalho(esc(c.nome), `Cliente desde ${dataBR(c.criado)}`, `<button class="btn pri" data-act="nova-prosp" data-cliente="${id}">Nova prospecção</button><button class="btn" data-act="editar-cliente" data-id="${id}">Editar</button>${botoesExportar()}<button class="btn danger" data-act="del-cliente" data-id="${id}">Excluir</button>`) +
    `<div class="grid g3 mb">
      <div class="card"><h2>Dados</h2><dl>${info.map(([k, v]) => `<div><dt>${k}</dt><dd>${esc(v) || "—"}</dd></div>`).join("")}</dl>${c.observacoes ? `<p class="ink2">${esc(c.observacoes)}</p>` : ""}</div>
      <div class="card flush span2"><h2>Prospecções e projetos</h2>${ps.length ? `<table><thead><tr><th>Projeto</th><th>Tipos</th><th>Situação</th><th>Etapa</th><th>Contato</th>${verValores() ? `<th class="num">Valor</th>` : ""}</tr></thead><tbody>${ps.map((p) => `<tr><td><a href="#/prospeccao/${p.id}">${esc(p.titulo)}</a></td><td class="ink2">${esc(tiposDe(p))}</td><td><label class="badge st-sel ${STATUS[p.status].cls}"><select data-act="prosp-status" data-id="${p.id}" aria-label="Situação">${opts(Object.keys(STATUS).map((k) => [k, STATUS[k].label]), p.status)}</select></label></td><td class="ink2">${p.status === "cancelado" ? "—" : esc(etapaDe(p))}</td><td>${dataBR(p.contato)}</td>${verValores() ? `<td class="num">${R$(p.valor)}</td>` : ""}</tr>`).join("")}</tbody></table>` : `<p class="empty">Nenhuma prospecção para este cliente.</p>`}</div>
    </div>` + blocoContatos(id) + blocoFinanceiroVinculado((l) => l.clienteId === id, "cliente", `data-cliente="${id}"`);
}

/* ---------- Prospecções ---------- */
let fpStatus = "aberto", fpTipo = "", fpAno = "todos";
function pgProspeccoes() {
  const doPeriodo = db.prospeccoes.filter((p) => (fpAno === "todos" || p.contato.startsWith(fpAno)) && (!fpTipo || p.tipos.includes(Number(fpTipo))));
  const lista = doPeriodo.filter((p) => p.status === fpStatus).sort((a, b) => b.contato.localeCompare(a.contato));
  // Projetos fechados ficam na Esteira; aqui só o que ainda está em negociação
  const abas = [["aberto", "Em aberto"], ["cancelado", "Cancelados"]];
  return cabecalho("Prospecções", `${lista.length} projeto(s)${verValores() ? " · " + R$(soma(lista)) : ""}`, botoesExportar("prospeccoes") + `<button class="btn pri" data-act="nova-prosp">Nova prospecção</button>`) +
    `<div class="bar mb"><div class="actions">${abas.map(([s, l]) => `<button class="btn sm ${fpStatus === s ? "on" : ""}" data-act="fp-status" data-v="${s}">${l} <span class="muted">${doPeriodo.filter((p) => p.status === s).length}</span></button>`).join("")}</div>
      <div class="actions"><select class="input" data-act="fp-tipo" aria-label="Tipo de projeto"><option value="">Todos os tipos</option>${db.tipos.map((t) => `<option value="${t.id}" ${String(t.id) === fpTipo ? "selected" : ""}>${esc(t.nome)}</option>`).join("")}</select>${selAno(anosDe(db.prospeccoes.map((p) => p.contato)), fpAno).replace('data-act="ano"', 'data-act="fp-ano"')}</div></div>
    <div class="card flush">${lista.length ? `<table><thead><tr><th>Projeto</th><th>Cliente</th><th>Tipos</th><th>Situação</th><th>Etapa</th><th>Contato</th>${verValores() ? `<th class="num">Valor</th>` : ""}<th></th></tr></thead><tbody>${lista.map((p) => `<tr>
      <td><a href="#/prospeccao/${p.id}"><b>${esc(p.titulo)}</b></a></td><td><a href="#/cliente/${p.clienteId}">${esc(cliente(p.clienteId)?.nome)}</a></td><td class="ink2">${esc(tiposDe(p))}</td><td>${badge(p.status)}</td><td class="ink2">${p.status === "cancelado" ? "—" : esc(etapaDe(p))}</td><td>${dataBR(p.contato)}</td>${verValores() ? `<td class="num">${R$(p.valor)}</td>` : ""}
      <td>${p.status === "aberto" ? `<span class="actions" style="flex-wrap:nowrap"><button class="btn sm" data-act="fechou" data-id="${p.id}">Fechou</button><button class="btn sm" data-act="editar-prosp" data-id="${p.id}" data-cancelar="1">Cancelar</button></span>` : ""}</td></tr>`).join("")}</tbody></table>` : `<p class="empty">Nenhuma prospecção encontrada.</p>`}</div>`;
}
function pgProspeccao(id) {
  const p = prosp(id); if (!p) return `<p class="empty">Prospecção não encontrada.</p>`;
  const c = cliente(p.clienteId);
  const et = db.etapas.filter((e) => e.prospeccaoId === id).sort((a, b) => a.ordem - b.ordem);
  const feitas = et.filter((e) => e.concluida).length;
  return cabecalho(esc(p.titulo), `Cliente: <a href="#/cliente/${c.id}">${esc(c.nome)}</a>`, `<button class="btn pri" data-act="editar-prosp" data-id="${id}">Editar</button>${botoesExportar()}<button class="btn danger" data-act="del-prosp" data-id="${id}">Excluir</button>`) +
    `<div class="card mb"><div class="grid g4">
      <div><dt>Situação</dt><dd>${badge(p.status)}</dd></div><div><dt>Tipos de projeto</dt><dd>${esc(tiposDe(p))}</dd></div>
      <div><dt>Etapa da esteira</dt><dd><select class="input" data-act="prosp-esteira" data-id="${id}" aria-label="Etapa da esteira">${opts(ESTEIRA, etapaDe(p))}</select></dd></div>
      <div><dt>Andamento</dt><dd><select class="input" data-act="prosp-andamento" data-id="${id}" aria-label="Andamento">${opts(Object.entries(ANDAMENTOS).map(([k, a]) => [k, a.label]), p.andamento, "—")}</select></dd></div>
      <div><dt>Responsável</dt><dd><select class="input" data-act="prosp-resp" data-id="${id}" aria-label="Responsável">${opcoesPessoas(p.responsavelId)}</select></dd></div>
      ${verValores() ? `<div><dt>Valor</dt><dd>${R$(p.valor)}</dd></div>` : ""}<div><dt>Contato · ${p.status === "cancelado" ? "cancelamento" : "fechamento"}</dt><dd>${dataBR(p.contato)} · ${dataBR(p.fechamento)}</dd></div>
      ${p.motivo ? `<div class="span2"><dt>Motivo do cancelamento</dt><dd>${esc(p.motivo)}</dd></div>` : ""}${p.obs ? `<div class="span2"><dt>Observações</dt><dd>${esc(p.obs)}</dd></div>` : ""}
    </div></div>
    ${blocoTarefas(id)}
    <div class="grid g2">
      <div class="card"><div class="bar"><h2>Etapas e prazos</h2>${et.length ? `<span class="muted">${feitas} de ${et.length} concluídas</span>` : ""}</div>
        ${et.length ? `<div class="progress"><div style="width:${pct(feitas, et.length)}%"></div></div>` : ""}
        <ul class="steps">${et.map((e) => `<li class="${e.concluida ? "done" : ""}">
          <button class="btn sm" data-act="etapa-ok" data-id="${e.id}" title="${e.concluida ? "Reabrir" : "Concluir"}">${e.concluida ? "✓" : "○"}</button>
          <span class="nm">${esc(e.nome)}</span>
          ${e.concluida ? `<span class="small muted">concluída em ${dataBR(e.concluidaEm)}</span>` : `<input class="input" type="date" style="width:auto;padding:4px 6px" value="${e.prazo || ""}" data-act="etapa-prazo" data-id="${e.id}" aria-label="Prazo">${situacaoPrazo(e.prazo)}`}
          <button class="btn sm danger" data-act="del-etapa" data-id="${e.id}" aria-label="Excluir etapa">×</button></li>`).join("")}</ul>
        <form class="actions addform" style="margin-top:12px" data-form="etapa" data-prosp="${id}"><input class="input" name="nome" style="flex:1;min-width:180px" placeholder="Nova etapa (ex.: Aprovação na prefeitura)" required><input class="input" type="date" name="prazo" style="width:auto" aria-label="Prazo"><button class="btn">Adicionar</button></form>
        ${et.length ? "" : `<button class="btn sm" style="margin-top:10px" data-act="etapas-padrao" data-id="${id}">Usar etapas padrão de arquitetura</button><p class="small muted" style="margin:6px 0 0">Briefing, estudo preliminar, anteprojeto, executivo, aprovação e entrega.</p>`}
      </div>
      ${blocoContatos(c.id, id)}
    </div>
    ${blocoChecklist(p)}` + blocoFinanceiroVinculado((l) => l.prospeccaoId === id, "projeto", `data-cliente="${c.id}" data-prosp="${id}"`);
}

const checkAbertos = new Set();
function blocoChecklist(p) {
  const feitos = p.checklist || {}, total = CHECKLIST.reduce((t, [, its]) => t + its.length, 0);
  const marcados = Object.keys(feitos).filter((k) => feitos[k]).length;
  return `<div class="card mb checklist"><div class="bar"><h2>Check list de conferência · Projeto legal</h2><span class="muted">${marcados} de ${total} conferidos</span></div>
    <div class="progress"><div style="width:${pct(marcados, total)}%"></div></div>
    ${CHECKLIST.map(([sec, its], s) => {
      const ok = its.filter((_, i) => feitos[s + "-" + i]).length;
      return `<details data-sec="${s}" ${checkAbertos.has(s) ? "open" : ""}><summary><span>${esc(sec)}</span><span class="small ${ok === its.length ? "pos" : "muted"}">${ok}/${its.length}</span></summary>
        <ul>${its.map((it, i) => `<li><label><input type="checkbox" data-act="check-item" data-id="${p.id}" data-k="${s}-${i}" ${feitos[s + "-" + i] ? "checked" : ""}><span>${esc(it)}</span></label></li>`).join("")}</ul></details>`;
    }).join("")}</div>`;
}
document.addEventListener("toggle", (e) => { const s = e.target.dataset?.sec; if (s == null) return; e.target.open ? checkAbertos.add(Number(s)) : checkAbertos.delete(Number(s)); }, true);

/* ---------- Esteira de projetos ---------- */
let feTipo = "", feResp = "", feBusca = "";
const filtraBusca = (txt) => !feBusca || txt.toLowerCase().includes(feBusca.toLowerCase());
function resumoFin(p) {
  if (!finLiberado()) return "";
  const ent = db.lancamentos.filter((l) => l.prospeccaoId === p.id && l.tipo === "entrada");
  if (!ent.length) return "";
  return `<span class="small muted" title="Recebido de ${R$(soma(ent))}">${R$c(soma(ent.filter((l) => l.pago)))} de ${R$c(soma(ent))}</span>`;
}
function cartaoProjeto(p) {
  const c = cliente(p.clienteId);
  return `<article class="kcard" data-drag="prosp" data-id="${p.id}">
    <a class="tit" href="#/prospeccao/${p.id}">${esc(p.titulo)}</a>
    <div class="small"><a href="#/cliente/${p.clienteId}" class="muted">${esc(c?.nome || "—")}</a></div>
    ${p.tipos.length ? `<div class="chips">${p.tipos.map((t) => `<span class="tagp">${esc(tipoNome(t))}</span>`).join("")}</div>` : ""}
    ${p.andamento ? `<div>${andamentoTag(p.andamento)}</div>` : ""}
    <div class="rod">${respTag(p.responsavelId)}${resumoFin(p)}</div>
  </article>`;
}
function pgEsteira() {
  const lista = db.prospeccoes.filter((p) => p.status !== "cancelado" && (!feTipo || p.tipos.includes(Number(feTipo))) && (!feResp || (p.responsavelId || "-") === feResp) && filtraBusca(p.titulo + " " + (cliente(p.clienteId)?.nome || "")));
  return cabecalho("Esteira de projetos", `${lista.length} projeto(s) · arraste os cartões entre as colunas`, `<button class="btn pri" data-act="nova-prosp">Novo projeto</button>`) +
    `<div class="bar mb"><input class="input" id="busca-est" style="max-width:320px" placeholder="Buscar projeto ou cliente" value="${esc(feBusca)}">
      <div class="actions"><select class="input" data-act="fe-tipo" aria-label="Tipo de projeto"><option value="">Todos os tipos</option>${db.tipos.map((t) => `<option value="${t.id}" ${String(t.id) === feTipo ? "selected" : ""}>${esc(t.nome)}</option>`).join("")}</select>
      <select class="input" data-act="fe-resp" aria-label="Responsável"><option value="">Todos os responsáveis</option>${pessoas.map((x) => `<option value="${x.id}" ${x.id === feResp ? "selected" : ""}>${esc(x.nome)}</option>`).join("")}<option value="-" ${feResp === "-" ? "selected" : ""}>Sem responsável</option></select></div></div>
    <div class="kanban">${ESTEIRA.map((col, i) => {
      const cs = lista.filter((p) => etapaDe(p) === col);
      return `<section class="kcol" data-drop="prosp" data-v="${i}"><header><span>${esc(col)} <span class="muted">${cs.length}</span></span>${i === 0 ? `<button class="btn sm" data-act="nova-prosp" title="Nova prospecção">+</button>` : ""}</header><div class="kcards">${cs.map(cartaoProjeto).join("")}</div></section>`;
    }).join("")}</div>`;
}
// Mover na esteira também atualiza a situação comercial: sair de "Em prospecção" para uma etapa de trabalho fecha o projeto
function moverProjeto(p, i) {
  i = Math.max(0, Math.min(ESTEIRA.length - 1, i));
  if (ESTEIRA[i] === etapaDe(p)) return;
  p.esteira = ESTEIRA[i];
  let msg = "Movido para " + ESTEIRA[i];
  if (i === 0 && p.status === "fechado") { p.status = "aberto"; p.fechamento = null; msg += " (voltou a ficar em aberto)"; }
  else if (i >= 1 && i <= 8 && p.status === "aberto") { p.status = "fechado"; p.fechamento = HOJE; msg += " e marcado como fechado"; }
  salvar(); render(); toast(msg);
}

// Trocar a situação também acerta a esteira: fechado sai de "Em prospecção" para "Contrato"; reaberto volta para "Em prospecção"
function mudarStatus(p, st) {
  if (!STATUS[st] || p.status === st) return;
  p.status = st;
  p.fechamento = st === "aberto" ? null : p.fechamento || HOJE;
  if (st === "fechado" && ESTEIRA.indexOf(etapaDe(p)) <= 0) p.esteira = ESTEIRA[1];
  if (st === "aberto") p.esteira = ESTEIRA[0];
  salvar(); render(); toast("Situação: " + STATUS[st].label + (st === "fechado" ? " · agora aparece na Esteira" : ""));
}

/* ---------- Tarefas (agenda por responsável) ---------- */
let ftOcultar = false;
function cartaoTarefa(t) {
  const p = prosp(t.prospeccaoId), feita = t.andamento === "concluido";
  return `<article class="kcard ${feita ? "feita" : ""}" data-drag="tarefa" data-id="${t.id}">
    <a class="tit" href="#" data-act="editar-tarefa" data-id="${t.id}">${esc(t.titulo)}</a>
    ${p ? `<div class="small"><a href="#/prospeccao/${p.id}" class="muted">${esc(cliente(p.clienteId)?.nome || "")} · ${esc(p.titulo)}</a></div>` : ""}
    <div class="rod"><span class="actions">${t.urgente ? `<span class="urg">Urgente</span>` : ""}${andamentoTag(t.andamento)}${t.prazo && !feita ? `<span class="small muted">${dataBR(t.prazo)}</span>${situacaoPrazo(t.prazo)}` : ""}</span>
      <span class="kmove"><button type="button" data-act="tarefa-ok" data-id="${t.id}" title="${feita ? "Reabrir" : "Concluir"}">${feita ? "↺" : "✓"}</button><button type="button" data-act="del-tarefa" data-id="${t.id}" title="Excluir">×</button></span></div>
  </article>`;
}
const ordemTarefas = (a, b) => (b.urgente ? 1 : 0) - (a.urgente ? 1 : 0) || (a.andamento === "concluido") - (b.andamento === "concluido") || (a.prazo || "9999").localeCompare(b.prazo || "9999");

const EMBUTIDO = false;
function baixarCSV(nome, cab, linhas) {
  if (EMBUTIDO) {
    // Dentro do app Claude downloads ficam bloqueados: copia a tabela para colar no Excel
    const tsv = [cab, ...linhas].map((l) => l.map((v) => (v == null ? "" : typeof v === "number" ? v.toFixed(2).replace(".", ",") : String(v).replace(/[\t\n\r]+/g, " "))).join("\t")).join("\n");
    navigator.clipboard.writeText(tsv).then(() => toast("Tabela copiada. Abra o Excel e cole (Ctrl+V)."), () => toast("Não foi possível copiar neste aparelho."));
    return;
  }
  const cel = (v) => { if (v == null) return ""; const s = typeof v === "number" ? v.toFixed(2).replace(".", ",") : String(v); return /[;"\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const txt = "﻿" + [cab, ...linhas].map((l) => l.map(cel).join(";")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([txt], { type: "text/csv;charset=utf-8" }));
  a.download = `${nome}-${HOJE}.csv`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function rosca(p, cor) {
  const r = 46, c = 2 * Math.PI * r, v = Math.max(0, Math.min(100, p));
  return `<svg viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="${v}%"><circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="12"/>
    <circle cx="60" cy="60" r="${r}" fill="none" stroke="${cor}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${(c * v) / 100} ${c}" transform="rotate(-90 60 60)"/>
    <text x="60" y="66" text-anchor="middle" style="font-size:20px;font-weight:600;fill:var(--ink)">${v}%</text></svg>`;
}
function pizza(dados, moeda = true) {
  const tot = dados.reduce((t, d) => t + d.valor, 0);
  if (!tot) return `<p class="empty">Sem dados no período.</p>`;
  let lista = dados.slice().sort((a, b) => b.valor - a.valor);
  if (lista.length > 8) { const resto = lista.slice(7); lista = [...lista.slice(0, 7), { nome: "Outros", valor: resto.reduce((t, d) => t + d.valor, 0), outros: true }]; }
  const R = 70, r = 44; let ang = -Math.PI / 2, s = "";
  lista.forEach((d, i) => {
    const a = (d.valor / tot) * Math.PI * 2, a2 = ang + a, large = a > Math.PI ? 1 : 0, cor = d.outros ? "var(--muted)" : CORES_CAT[i];
    const p = (rr, t) => `${90 + rr * Math.cos(t)},${90 + rr * Math.sin(t)}`;
    const t = `<b>${esc(d.nome)}</b>${moeda ? R$(d.valor) : d.valor} · ${pct(d.valor, tot)}%`;
    s += lista.length === 1 ? `<g data-tip="${esc(t)}"><circle cx="90" cy="90" r="${(R + r) / 2}" fill="none" stroke="${cor}" stroke-width="${R - r}"/></g>`
      : `<path data-tip="${esc(t)}" d="M${p(R, ang)} A${R},${R} 0 ${large} 1 ${p(R, a2)} L${p(r, a2)} A${r},${r} 0 ${large} 0 ${p(r, ang)} Z" fill="${cor}" stroke="var(--surface)" stroke-width="2"/>`;
    ang = a2;
  });
  return `<div class="pizza"><svg viewBox="0 0 180 180" width="180" height="180" role="img">${s}</svg>
    <ul class="pleg">${lista.map((d, i) => `<li><span class="dot" style="background:${d.outros ? "var(--muted)" : CORES_CAT[i]}"></span><span class="nm">${esc(d.nome)}</span><span class="num">${pct(d.valor, tot)}%</span></li>`).join("")}</ul></div>`;
}
function fluxoSemestre(meses) {
  const W = Math.max(320, Math.min(620, innerWidth - 80)), H = 250, esq = 70, topo = 10, base = H - 24;
  const max = Math.max(1, ...meses.map((m) => Math.max(m.r, m.d)));
  const { max: M, passos } = escala(max);
  const meio = topo + (base - topo) / 2, y = (v) => meio - (v / M) * ((base - topo) / 2);
  const col = (W - esq) / meses.length, bw = Math.min(46, col * 0.55);
  let s = `<g class="grid">${passos.flatMap((v) => (v ? [v, -v] : [0])).map((v) => `<line x1="${esq}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text x="${esq - 6}" y="${y(v) + 4}" text-anchor="end">${R$c(v)}</text>`).join("")}</g>`;
  const pts = [];
  meses.forEach((m, i) => {
    const cx = esq + col * i + col / 2, x0 = cx - bw / 2, res = m.r - m.d;
    const t = `<b>${ymNome(m.ym)}</b>Recebimentos: ${R$(m.r)}<br>Despesas: ${R$(m.d)}<br>Resultado: ${R$(res)}`;
    s += `<g class="mark" data-tip="${esc(t)}"><rect class="hit" x="${esq + col * i}" y="0" width="${col}" height="${base}"/>
      ${m.r ? `<rect class="m" x="${x0}" y="${y(m.r)}" width="${bw}" height="${meio - y(m.r)}" fill="var(--rec)" rx="2"/>` : ""}
      ${m.d ? `<rect class="m" x="${x0}" y="${meio}" width="${bw}" height="${y(-m.d) - meio}" fill="var(--desp)" rx="2"/>` : ""}
      <text x="${cx}" y="${H - 6}" text-anchor="middle">${MESES[Number(m.ym.slice(5)) - 1].toUpperCase()}</text></g>`;
    pts.push([cx, y(res)]);
  });
  s += `<line x1="${esq}" x2="${W}" y1="${meio}" y2="${meio}" stroke="var(--ink)" stroke-width="2"/>`;
  s += `<polyline points="${pts.map((p) => p.join(",")).join(" ")}" fill="none" stroke="var(--ink-2)" stroke-width="1.5" stroke-dasharray="3 3"/>`;
  s += pts.map(([x, yy]) => `<circle cx="${x}" cy="${yy}" r="3.5" fill="var(--ink)"/>`).join("");
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img">${s}</svg><div class="legend"><span style="--c:var(--rec)">Recebimentos</span><span style="--c:var(--desp)">Despesas</span><span style="--c:var(--ink)">Resultado (linha)</span></div></div>`;
}
function calendario(ym) {
  const [a, m] = ym.split("-").map(Number), primeiro = new Date(a, m - 1, 1).getDay(), dias = new Date(a, m, 0).getDate();
  const ls = db.lancamentos.filter((l) => noMes(l, ym) && filtraConta(l));
  let cel = Array.from({ length: primeiro }, () => `<div></div>`);
  for (let d = 1; d <= dias; d++) {
    const ds = `${ym}-${pad(d)}`, doDia = ls.filter((l) => l.data === ds);
    const dots = [["entrada", "var(--rec)"], ["saida", "var(--desp)"], ["transf", "var(--series-1)"]].filter(([t]) => doDia.some((l) => l.tipo === t)).map(([, c]) => `<i style="background:${c}"></i>`).join("");
    cel.push(`<button class="dia ${ds === fDia ? "sel" : ""} ${ds === HOJE ? "hoje" : ""}" data-act="f-dia" data-v="${ds}">${d}<span>${dots}</span></button>`);
  }
  return `<div class="cal"><div class="calh">${["DOM", "SEG", "TER", "QUA", "QUI", "SEX", "SÁB"].map((d) => `<div>${d}</div>`).join("")}</div><div class="calg">${cel.join("")}</div>
    <div class="legend" style="justify-content:center"><span style="--c:var(--rec)">recebimentos</span><span style="--c:var(--desp)">despesas</span><span style="--c:var(--series-1)">transferências</span></div></div>`;
}

const SUBNAV = [["dashboard", "Dashboard"], ["transacoes", "Transações"], ["relatorios", "Relatórios"], ["contatos", "Contatos"], ["importar", "Importar / Exportar"], ["configuracoes", "Configurações"]];
function moldura(sub, corpo) {

  const g = (ls, grupo) => soma(ls.filter((l) => catGrupo(l) === grupo));

    ["↑ RECEBIMENTOS", atual.rPrev, ant.rPrev, "var(--rec)", true],
    ["↓ DESPESAS", atual.dPrev, ant.dPrev, "var(--desp)", true],
    ["Despesas fixas", g(atual.d, "fixa"), g(ant.d, "fixa"), "var(--warn-bar)"],
    ["Despesas variáveis", g(atual.d, "variavel"), g(ant.d, "variavel"), "var(--warn-bar)"],
    ["Pessoas", g(atual.d, "pessoas"), g(ant.d, "pessoas"), "var(--warn-bar)"],
    ["Impostos", g(atual.d, "impostos"), g(ant.d, "impostos"), "var(--warn-bar)"],
  ];
  const semestre = [-5, -4, -3, -2, -1, 0].map((n) => { const ym = ymAdd(fMes, n), r = resumoMes(ym); return { ym, r: r.rPrev, d: r.dPrev }; });
  const atrasos = db.lancamentos.filter((l) => atrasado(l) && filtraConta(l)).sort((a, b) => b.data.localeCompare(a.data));
  const doDia = db.lancamentos.filter((l) => l.data === fDia && filtraConta(l));
  const receita = atual.rPrev, imp = g(atual.d, "impostos"), varr = g(atual.d, "variavel"), fixa = g(atual.d, "fixa"), pes = g(atual.d, "pessoas");
  const dre = [["Receita Bruta", receita, "b"], ["(−) Impostos", -imp], ["LUCRO BRUTO", receita - imp, "t"], ["(−) Total de Desp. Variáveis", -varr], ["LUCRO OPERACIONAL", receita - imp - varr, "t"], ["(−) Total de Desp. Fixas", -fixa], ["(−) Gastos com Pessoal", -pes], ["LUCRO LÍQUIDO DO EXERCÍCIO", receita - imp - varr - fixa - pes, "t"]];
  return cabecalho("Dashboard", `Olá, ${esc(sessao.nome)}`, seletorConta() + seletorMes()) + `
  <div class="grid g2 fin">
    <div class="col">
      <div class="card"><h2>Previsto x Realizado</h2><p class="sub">${fConta === "todas" ? "Todas as contas" : esc(conta(fConta).nome)}</p>
        <div class="grid g2"><div class="pxr">${rosca(pct(atual.rReal, atual.rPrev), "var(--rec)")}<div class="lbl2">RECEBIMENTOS</div>${barraProg(atual.rReal, atual.rPrev, "var(--rec)")}
          ${linhaKV("Realizado:", R$(atual.rReal))}${linhaKV("Falta:", R$(atual.rPrev - atual.rReal))}${linhaKV("Previsto:", R$(atual.rPrev), "muted")}</div>
          <div class="pxr">${rosca(pct(atual.dReal, atual.dPrev), "var(--desp)")}<div class="lbl2">DESPESAS</div>${barraProg(atual.dReal, atual.dPrev, "var(--desp)")}
          ${linhaKV("Realizado:", R$(atual.dReal))}${linhaKV("Falta:", R$(atual.dPrev - atual.dReal))}${linhaKV("Previsto:", R$(atual.dPrev), "muted")}</div></div></div>
      <div class="card"><h2>Fluxo de caixa do semestre</h2><p class="sub">Recebimentos e despesas previstos por mês</p>${fluxoSemestre(semestre)}</div>
      <div class="card"><h2>Comparativo mês anterior</h2><p class="sub">${ymNome(fMes)} comparado a ${ymNome(ymAdd(fMes, -1))}</p>
        <div class="comp">${comp.map(([n, a, b, cor, forte]) => { const dif = a - b, pc = b ? Math.round((dif / b) * 10000) / 100 : 0; const bom = n.includes("RECEB") ? dif >= 0 : dif <= 0;
          return `<div class="crow ${forte ? "" : "ind"}"><div class="cn">${n}</div><div class="cv">${dif >= 0 ? "+" : "−"}${R$(Math.abs(dif))}</div><div class="cp ${bom ? "pos" : "neg"}">${dif >= 0 ? "+" : ""}${pc.toFixed(2).replace(".", ",")} % ${dif >= 0 ? "↑" : "↓"}</div>

      <div class="card"><h2>Demonstração de Resultados</h2><p class="sub">${ymNome(fMes)} · valores previstos do mês</p>
        <table class="dre"><tbody>${dre.map(([n, v, t]) => `<tr class="${t || ""}"><td>${n}</td><td class="num ${v < 0 ? "neg" : ""}">${R$(Math.abs(v))}</td></tr>`).join("")}</tbody></table></div>
    </div>

    </div>
  </div>`;
}

      <div class="mini">${fluxoSemestre(tres)}</div>
      <div><div class="lbl2">CONTA</div>${seletorConta()}<div class="big pos" style="margin-top:6px">${R$(saldoTotal())}</div>
        <div class="small muted">Previsão de fechamento do mês: ${R$(saldoTotal() + (atual.rPrev - atual.rReal) - (atual.dPrev - atual.dReal))}</div>

    </div>

          <td class="small">${tr ? "Transferência" : `<select class="ie ie-cat" data-act="f-ed" data-k="categoriaId" data-id="${l.id}" aria-label="Categoria">${opcoesCategoria(l.tipo, l.categoriaId)}</select>`}</td>
          <td class="small">${tr ? "—" : `<select class="ie ie-pag" data-act="f-pagto" data-id="${l.id}" aria-label="Pagamento">${opts([["avista", "À vista"], ["parcelado", pg === "parcelado" ? "Parcelado" : "Criar parcelas"], ["repetir", pg === "repetir" ? "Repetindo" : "Repetir transação"]], pg)}</select>`}</td>
          <td>${toggle(l)}</td>
          <td><button type="button" class="ok-linha" data-act="f-linha-ok" title="Concluir edição" aria-label="Concluir edição">✓</button></td></tr>`; }).join("")}
        ${ls.length ? "" : `<tr><td colspan="10" class="empty">Nenhuma movimentação neste mês.</td></tr>`}
      </tbody></table></div>
      <div class="totais"><span>Total <b>${R$(soma(total))}</b></span><span>${rotulo[2]} <b>${R$(soma(total.filter((l) => l.pago)))}</b></span><span>${rotulo[3]} <b>${R$(soma(total.filter((l) => !l.pago)))}</b></span></div>
    </div>`;
}

const RELATORIOS = [

const FREQS = [["semanal", "Semanal"], ["quinzenal", "Quinzenal"], ["mensal", "Mensal"], ["bimestral", "Bimestral"], ["trimestral", "Trimestral"], ["semestral", "Semestral"], ["anual", "Anual"]];
const freqNome = (k) => (FREQS.find(([v]) => v === k) || FREQS[2])[1];
const passoData = (s, freq, i) => (freq === "semanal" ? addDias(s, 7 * i) : freq === "quinzenal" ? addDias(s, 15 * i) : addMeses(s, i * ({ bimestral: 2, trimestral: 3, semestral: 6, anual: 12 }[freq] || 1)));
const dividir = (total, n) => { const parte = Math.floor((total / n) * 100) / 100; return Array.from({ length: n }, (_, i) => (i === n - 1 ? Math.round((total - parte * (n - 1)) * 100) / 100 : parte)); };
const pagamentoDe = (l) => l.modo || (l.parcela ? "parcelado" : "avista");
const membrosSerie = (l) => (l.grupo ? db.lancamentos.filter((x) => x.grupo === l.grupo).sort((a, b) => a.data.localeCompare(b.data)) : [l]);
const gerarLinhas = (data0, n, freq, modo, valor) => (modo === "parcelado" ? dividir(valor, n) : Array(n).fill(valor)).map((v, i) => ({ data: passoData(data0, freq, i), valor: v }));
// Transforma o lançamento (e os irmãos da série) nas linhas informadas; sobras não pagas são excluídas
function aplicarSerie(l, modo, freq, linhas) {
  const membros = membrosSerie(l), grupo = l.grupo || uid(), n = linhas.length;
  linhas.forEach((r, i) => {
    let x = membros[i];
    if (!x) { x = { ...l, id: uid(), tags: [...(l.tags || [])], pago: false, pagoEm: null }; db.lancamentos.push(x); }
    Object.assign(x, { data: r.data, valor: r.valor, competencia: r.data.slice(0, 7), parcela: `${i + 1}/${n}`, grupo, modo, freq });
  });
  membros.slice(n).forEach((x) => { if (x.pago) Object.assign(x, { grupo: null, modo: null, freq: null, parcela: null }); else db.lancamentos = db.lancamentos.filter((y) => y !== x); });
}
// Voltar para à vista: parcelas viram um lançamento só; repetição para aqui (as próximas não pagas saem)
function tornarAVista(l) {
  const outros = membrosSerie(l).filter((x) => x !== l);
  if (l.modo === "repetir") {
    const futuros = outros.filter((x) => !x.pago && x.data > l.data);
    perguntar(`Parar a repetição? ${futuros.length ? `As ${futuros.length} repetição(ões) seguintes não pagas serão excluídas.` : ""}`, "Parar repetição", () => {
      db.lancamentos = db.lancamentos.filter((x) => !futuros.includes(x));
      [l, ...outros].forEach((x) => Object.assign(x, { grupo: null, modo: null, freq: null, parcela: null }));
      salvar(); render(); toast("Agora é à vista");
    });
  } else {
    const juntar = outros.filter((x) => !x.pago), total = Math.round((l.valor + soma(juntar)) * 100) / 100;
    perguntar(outros.length ? `Juntar as parcelas não pagas neste lançamento, à vista, no valor de ${R$(total)}?` : "Marcar este lançamento como à vista?", "Confirmar", () => {
      db.lancamentos = db.lancamentos.filter((x) => !juntar.includes(x));
      [l, ...outros].forEach((x) => Object.assign(x, { grupo: null, modo: null, freq: null, parcela: null }));
      l.valor = total; salvar(); render(); toast("Agora é à vista");
    });
  }
}

function somaSerie() {

function gerarLancSerie(el) {

const novoLanc = (o) => ({ id: uid(), categoriaId: null, contaId: fConta === "todas" ? db.contas[0].id : fConta, contaDestinoId: null, competencia: o.data.slice(0, 7), forma: "", documento: "", centroId: null, tags: [], obs: "", descricao: "", clienteId: null, prospeccaoId: null, parcela: null, pagoEm: o.pago ? o.data : null, ...o });
function importarArquivo(input, tipo) {
  const arq = input.files[0]; if (!arq) return;
  const fr = new FileReader();
  fr.onload = () => {
    const txt = String(fr.result); let n = 0;
    if (tipo === "ofx") {
      for (const bloco of txt.split(/<STMTTRN>/i).slice(1)) {
        const campoO = (t) => (bloco.match(new RegExp(`<${t}>([^<\\r\\n]*)`, "i")) || [])[1]?.trim();
        const v = Number(String(campoO("TRNAMT") || "0").replace(",", ".")), data = dataDe(campoO("DTPOSTED"));
        if (!v || !data) continue;
        db.lancamentos.push(novoLanc({ tipo: v > 0 ? "entrada" : "saida", valor: Math.abs(v), data, pago: true, descricao: (campoO("MEMO") || campoO("NAME") || "MOVIMENTAÇÃO OFX").toUpperCase(), documento: campoO("FITID") || "" })); n++;
      }
    } else if (tipo === "csv") {
      const linhas = lerCSV(txt); const cab = linhas[0].map((c) => c.toLowerCase());
      const ix = (nome) => cab.findIndex((c) => c.startsWith(nome));
      for (const l of linhas.slice(1)) {
        const data = dataDe(l[ix("data")]), valorBruto = parseValor(l[ix("valor")]); if (!data || isNaN(valorBruto)) continue;
        const tCol = (l[ix("tipo")] || "").toLowerCase(), t = tCol.startsWith("rec") || tCol.startsWith("ent") ? "entrada" : tCol ? "saida" : valorBruto >= 0 ? "entrada" : "saida";
        db.lancamentos.push(novoLanc({ tipo: t, valor: Math.abs(valorBruto), data, pago: /^s/i.test(l[ix("pago")] || ""), descricao: (l[ix("descri")] || "").toUpperCase(), categoriaId: acharCategoria(l[ix("categ")], t), clienteId: acharContato(l[ix("contato")], t) })); n++;
      }
    } else {
      const linhas = lerCSV(txt);
      for (const l of linhas.slice(1)) {
        if (!l[0]) continue; const tp = TIPOS_CONTATO_FIN.find((x) => x.toLowerCase() === (l[1] || "").toLowerCase()) || "Fornecedor";
        if (tp === "Cliente") db.clientes.push({ id: uid(), nome: l[0], documento: l[2] || "", email: l[3] || "", telefone: l[4] || "", cidade: l[5] || "", origem: "", endereco: "", observacoes: "", criado: HOJE });
        else db.fornecedores.push({ id: uid(), nome: l[0], tipo: tp, documento: l[2] || "", email: l[3] || "", telefone: l[4] || "", cidade: l[5] || "" });
        n++;
      }
    }
    salvar(); render(); toast(n ? `${n} registro(s) importado(s)` : "Nenhum registro reconhecido no arquivo");
  };
  fr.readAsText(arq, "utf-8");
}

/* ===================== arrastar cartões entre colunas ===================== */
// Arraste próprio (mouse e toque), no estilo do Trello: o cartão segue o ponteiro e cai na coluna de baixo.
// No celular, segure o cartão por um instante para começar a arrastar; deslizar direto rola a tela.
let arraste = null, soltouEm = 0;
function colunaSob(x, y, tipo) {
  const col = document.elementFromPoint(x, y)?.closest?.("[data-drop]");

}
function iniciarArraste() {

function moverFantasma(x, y) {

// Rola o quadro sozinho quando o cartão chega perto das bordas

  const k = a.card.closest(".kanban"), r = k?.getBoundingClientRect(), m = 60;
  if (k) { if (a.x > r.right - m) k.scrollLeft += 14; else if (a.x < r.left + m) k.scrollLeft -= 14; }

  clearTimeout(a.timer); arraste = null;
  if (!a.ativo) return;
  const col = soltar ? colunaSob(a.x, a.y, a.tipo) : null;
  a.fantasma.remove(); a.card.classList.remove("origem"); document.body.classList.remove("arrastando");
  document.querySelectorAll(".kcol.over").forEach((c) => c.classList.remove("over"));

    if (a.tipo === "prosp") moverProjeto(prosp(a.id), Number(col.dataset.v));
    else { const t = db.tarefas.find((x) => x.id === a.id); if (t && (t.responsavelId || "") !== col.dataset.v) { t.responsavelId = col.dataset.v || null; salvar(); } }
  }
  renderPendente = false; render();
}
document.addEventListener("pointerdown", (e) => {
  const card = e.target.closest?.("[data-drag]");

  const toque = e.pointerType !== "mouse";
  arraste = { card, tipo: card.dataset.drag, id: card.dataset.id, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, toque, ativo: false };

  if (!l?.recibo) return;
  dlg2.style.width = "min(860px, calc(100vw - 24px))";
  dlg2.innerHTML = `<div class="dh"><h2 style="margin:0;display:flex;align-items:center;gap:10px">Recibo nº <input class="input" id="rec-num" value="${esc(numRecibo(l.recibo.numero))}" maxlength="30" aria-label="Número do recibo" title="Edite e tecle Enter" style="width:150px;font:inherit;font-size:18px;padding:4px 8px"></h2><button type="button" class="btn sm" id="rec-x" aria-label="Fechar">×</button></div><div class="db" style="padding:0;max-height:none"><p class="muted" id="rec-msg" style="padding:20px;margin:0">Gerando o PDF…</p><iframe id="rec-pdf" title="Recibo em PDF" style="display:none;width:100%;height:68vh;border:0;background:#fff"></iframe></div>
    <div class="df"><button type="button" class="btn" id="rec-fechar">Fechar</button><a class="btn" id="rec-baixar" download="Recibo ${esc(numRecibo(l.recibo.numero).replace(/[\\/:*?"<>|]/g, "-"))} - ${esc((pessoa(l.clienteId)?.nome || "Renan Grolli Arquitetura").replace(/[\\/:*?"<>|]/g, ""))}.pdf" aria-disabled="true">Baixar PDF</a><button type="button" class="btn pri" id="rec-imprimir" disabled>Imprimir</button></div>`;
  const fechar = () => dlg2.close();
  dlg2.onclose = () => { dlg2.onclose = null; dlg2.style.width = ""; if (urlRecibo) { URL.revokeObjectURL(urlRecibo); urlRecibo = null; } };
  dlg2.showModal();
  $("#rec-x", dlg2).onclick = fechar; $("#rec-fechar", dlg2).onclick = fechar;
  // Número do recibo editável: grava e refaz o PDF
  const campoNum = $("#rec-num", dlg2), montar = () => montarRecibo(l);
  campoNum.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); campoNum.blur(); } };
  campoNum.onchange = () => {
    const v = campoNum.value.trim().toUpperCase(); if (!v) { campoNum.value = numRecibo(l.recibo.numero); return; }
    if (db.lancamentos.some((x) => x !== l && x.recibo && numRecibo(x.recibo.numero) === v)) { toast("Já existe um recibo com esse número."); campoNum.value = numRecibo(l.recibo.numero); return; }
    l.recibo.numero = /^\d+$/.test(v) ? Number(v) : v; salvar();
    const b = dlg.querySelector(`[data-act="recibo-ver"][data-id="${l.id}"]`); if (b) b.textContent = `📄 Recibo nº ${numRecibo(l.recibo.numero)} · emitido em ${dataBR(l.recibo.emitido)}`;
    $("#rec-baixar", dlg2).download = `Recibo ${numRecibo(l.recibo.numero).replace(/[\\/:*?"<>|]/g, "-")} - ${(pessoa(l.clienteId)?.nome || "Renan Grolli Arquitetura").replace(/[\\/:*?"<>|]/g, "")}.pdf`;
    montar();
  };
  montar();
}
async function montarRecibo(l) {
  try {
    const blob = await pdfRecibo(l); if (urlRecibo) URL.revokeObjectURL(urlRecibo); urlRecibo = URL.createObjectURL(blob);
    const fr = $("#rec-pdf", dlg2), a = $("#rec-baixar", dlg2);
    fr.src = urlRecibo; fr.style.display = "block"; $("#rec-msg", dlg2)?.remove();
    a.href = urlRecibo; a.removeAttribute("aria-disabled");
    const imp = $("#rec-imprimir", dlg2); imp.disabled = false;
    imp.onclick = () => { try { fr.contentWindow.focus(); fr.contentWindow.print(); } catch { window.open(urlRecibo, "_blank"); } };
  } catch (e) {
    const m = $("#rec-msg", dlg2); if (m) m.textContent = "Não foi possível gerar o PDF agora. Verifique a internet e tente de novo.";
  }
}

/* ===================== saída automática por inatividade ===================== */
// Sem mexer no sistema por 30 minutos (em qualquer aba), a pessoa precisa entrar de novo
const INATIVO_MS = 30 * 60 * 1000, CHAVE_ATIVIDADE = "gestao-ultima-atividade";
let ultimaAtividade = Date.now();
const lerAtividade = () => { try { return Number(localStorage.getItem(CHAVE_ATIVIDADE)) || 0; } catch { return 0; } };
function marcarAtividade() {
  const agora = Date.now();
  if (agora - ultimaAtividade < 15000) return;
  ultimaAtividade = agora;
  try { localStorage.setItem(CHAVE_ATIVIDADE, String(agora)); } catch {}
  // Financeiro/Equipe destravados: o prazo de 30 min conta a partir do último uso, não da senha
  if (finAte > agora) { finAte = agora + INATIVO_MS; guardarSessao(); }
}
["pointerdown", "keydown", "scroll", "touchstart", "mousemove"].forEach((ev) => addEventListener(ev, marcarAtividade, { passive: true, capture: true }));
async function conferirInatividade() {
  if (!sessao) return;
  const ultima = Math.max(ultimaAtividade, lerAtividade());
  if (Date.now() - ultima < INATIVO_MS) return;
  finAte = 0; guardarSessao();
  if (canal) sb.removeChannel(canal);
  await sb.auth.signOut();
  sessao = null; db = vazio(); espelho = new Map(); ROTA = "#/painel"; render();
  toast("Sessão encerrada depois de 30 minutos sem uso. Entre de novo.");
}
setInterval(conferirInatividade, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) conferirInatividade(); });

/* ===================== acesso e equipe ===================== */
function telaNovaSenha() {
  return `<div class="center"><form class="card login" data-form="nova-senha">
    <div><p class="eyebrow">Área interna</p><h1>Nova senha</h1><p class="muted" style="margin:8px 0 0">Escolha a sua nova senha.</p></div>
    <label class="field"><span>Nova senha (mínimo 6 caracteres)</span><input class="input" name="senha" type="password" minlength="6" required autocomplete="new-password"></label>
    <div class="err" id="err-login"></div><button class="btn pri" style="justify-content:center">Salvar senha</button></form></div>`;
}
function formEsqueci() {
  abrir("Esqueci minha senha", `<p class="muted" style="margin-top:0">Digite seu e-mail. Você vai receber um link para criar uma nova senha.</p><div class="form">${campo("E-mail *", `<input class="input" type="email" name="email" required>`, true)}</div>`, "esqueci");
}
let equipe = null, acessos = [];
async function carregarEquipe() {
  const { data, error } = await sb.from("perfis").select("id, nome, email, admin, ativo, menus").order("nome");
  const ac = await sb.from("acessos").select("nome, area, quando").order("quando", { ascending: false }).limit(20);
  acessos = ac.data || [];
  equipe = (!error && data) || []; await carregarPessoas(); render();
}
function pgEquipe() {
  if (!pode("equipe")) return `<p class="empty">Acesso restrito.</p>`;
  if (!finLiberado()) return telaBloqueio("Equipe");
  if (!equipe) { carregarEquipe(); return `<p class="empty">Carregando…</p>`; }
  const menusDe = (p) => (p.admin ? "Todos os menus" : MENUS.filter(([m]) => (p.menus || []).includes(m)).map(([, l]) => l).join(", ") || "Nenhum menu");
  const linhas = equipe.map((p) => `<tr><td><b>${esc(p.nome)}</b><div class="small muted">${esc(p.email)}</div></td>
    <td>${p.ativo ? `<span class="badge b-good">Ativo</span>` : `<span class="badge b-critical">Bloqueado</span>`}</td>
    <td>${p.admin ? "Administrador" : "Equipe"}<div class="small muted">${esc(menusDe(p))}</div></td>
    <td class="num"><button class="btn sm" data-act="eq-editar" data-id="${p.id}">Editar</button>${p.id === sessao.id ? ` <span class="small muted">você</span>` : ` <button class="btn sm ${p.ativo ? "danger" : ""}" data-act="eq-ativo" data-id="${p.id}" data-v="${p.ativo ? 0 : 1}">${p.ativo ? "Bloquear" : "Liberar"}</button>`}</td></tr>`).join("");
  return cabecalho("Equipe", "Quem pode entrar no sistema") + `
    <div class="grid g2 mb"><div class="card flush span2"><table><thead><tr><th>Pessoa</th><th>Acesso</th><th>Perfil</th><th></th></tr></thead><tbody>${linhas || `<tr><td colspan="4" class="empty">Ninguém cadastrado.</td></tr>`}</tbody></table></div></div>
    ${acessos.length ? `<div class="card flush mb" style="max-width:640px"><h2>Últimos acessos ao Financeiro / Equipe</h2><table><tbody>${acessos.map((a) => `<tr><td>${new Date(a.quando).toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" })}</td><td>${esc(a.nome)}</td><td class="ink2">${esc(a.area)}</td></tr>`).join("")}</tbody></table></div>` : ""}
    <form class="card" data-form="novo-membro" style="max-width:640px"><h2>Cadastrar pessoa</h2><div class="form">
      ${campo("Nome *", `<input class="input" name="nome" required>`)}${campo("E-mail *", `<input class="input" type="email" name="email" required>`)}
      ${campo("Senha inicial (mínimo 6) *", `<input class="input" name="senha" minlength="6" required>`)}
    </div>${camposAcesso({ admin: false, menus: MENUS_PADRAO })}<button class="btn pri" style="margin-top:14px">Cadastrar</button>
    <p class="small muted">A pessoa recebe um e-mail para confirmar o cadastro. Depois é só entrar com o e-mail e a senha inicial, que ela pode trocar em "Trocar minha senha".</p></form>`;
}
// Marcações de administrador e de menus, usadas no cadastro e na edição
function camposAcesso(p, travar = false) {
  return `<div class="field" style="margin-top:14px"><span>Acesso</span>
    <label class="chip"><input type="checkbox" name="admin" ${p.admin ? "checked" : ""} ${travar ? "disabled" : ""} onchange="this.closest('form').querySelectorAll('[name=menus]').forEach((c) => (c.disabled = this.checked))"> Administrador (todos os menus)</label>
    <div class="chips" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">${MENUS.map(([m, l]) => `<label class="chip"><input type="checkbox" name="menus" value="${m}" ${p.admin || (p.menus || []).includes(m) ? "checked" : ""} ${p.admin ? "disabled" : ""}> ${l}</label>`).join("")}</div>
    ${travar ? `<span class="small muted">Você não pode tirar o seu próprio acesso de administrador.</span>` : `<span class="small muted">Financeiro e Equipe continuam pedindo a senha da área restrita.</span>`}</div>`;
}
function formEditarMembro(p) {
  const eu = p.id === sessao.id;
  abrir("Editar " + esc(p.nome), `<div class="form">
    ${campo("Nome *", `<input class="input" name="nome" value="${esc(p.nome)}" required>`)}${campo("E-mail *", `<input class="input" type="email" name="email" value="${esc(p.email || "")}" required>`)}
    ${campo("Nova senha (deixe em branco para manter)", `<input class="input" type="password" name="senha" minlength="6" autocomplete="new-password">`, true)}
  </div>${camposAcesso(p, eu && p.admin)}`, "editar-membro", `data-id="${p.id}"`);
}
async function salvarMembro(id, nome, email, senha, admin, menus) {
  const p = equipe.find((x) => x.id === id);
  const { data, error } = await sb.rpc("editar_usuario", { alvo: id, novo_nome: nome, novo_email: email, nova_senha: senha || null });
  if (error || data !== "ok") return toast("Não foi possível salvar: " + (error?.message || data));
  const acesso = id === sessao.id && p.admin ? { menus } : { admin, menus };
  const { error: e2 } = await sb.from("perfis").update(acesso).eq("id", id);
  if (e2) return toast("Dados salvos, mas o acesso não: " + e2.message);
  if (id === sessao.id) { sessao.nome = nome; sessao.email = email; }
  dlg.close(); toast(nome + " atualizado(a)" + (senha ? ", com senha nova" : "")); equipe = null; render();
}
async function criarMembro(nome, email, senha, admin, menus) {
  // Cliente separado, sem guardar sessão, para não deslogar o administrador
  const aux = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false, autoRefreshToken: false, storageKey: "gestao-aux" } });
  const { data, error } = await aux.auth.signUp({ email, password: senha, options: { data: { nome } } });
  if (error || !data.user) return toast("Não foi possível cadastrar: " + (error?.message || "erro desconhecido"));
  const { error: e2 } = await sb.from("perfis").update({ nome, admin, menus, ativo: true }).eq("id", data.user.id);
  if (e2) return toast("Cadastrado, mas não liberado: " + e2.message);
  toast(data.session ? nome + " cadastrado(a)" : nome + " cadastrado(a). Ela precisa confirmar pelo e-mail que vai receber."); equipe = null; render();
}
async function alterarPerfil(id, dados) {
  const { error } = await sb.from("perfis").update(dados).eq("id", id);
  if (error) return toast("Não foi possível alterar: " + error.message);
  equipe = null; render();
}

// Começa pela sessão salva no navegador; o Supabase avisa quando alguém entra ou sai
sb.auth.onAuthStateChange((evento, s) => {
  if (evento === "PASSWORD_RECOVERY") { recuperandoSenha = true; carregando = false; return render(); }
  if (evento === "SIGNED_IN" || evento === "INITIAL_SESSION") {
    const parada = evento === "INITIAL_SESSION" && lerAtividade() && Date.now() - lerAtividade() > INATIVO_MS;
    if (s?.user && parada) { setTimeout(async () => { await sb.auth.signOut(); carregando = false; render(); toast("Sessão encerrada depois de 30 minutos sem uso. Entre de novo."); }); return; }
    if (s?.user && sessao?.id !== s.user.id) setTimeout(() => entrar(s.user));
    else if (!s) { carregando = false; render(); }
  }
  if (evento === "SIGNED_OUT") { sessao = null; carregando = false; render(); }
});
render();
</script>
